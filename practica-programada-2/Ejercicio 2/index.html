<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulación CRUD con Modo Oscuro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Barra de navegacion -->
    <div class="sidebar">
        <h2 class="text-center">Menu</h2>
        <a href="#">Inicio</a>
        <a href="#">Usuarios</a>
        <a href="#">Configuracion</a>
        <a href="#">Ayuda</a>
        <button class="btn btn-light mt-4" id="toggleDarkMode">Modo Oscuro</button>
    </div>
    <!-- Contenido principal -->
    <div class="content">
        <h1 class="text-center mt-4">Gestion de Usuarios</h1>

        <!-- Formulario para agregar usuarios -->
        <h2>Agregar nuevo usuario</h2>
        <form id="userForm">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" placeholder="Ingrese su nombre" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Ingrese su email" required>
            </div>
            <div class="mb-3">
                <label for="rol" class="form-label">Rol de Usuario:</label>
                <select class="form-select" id="rol" required>
                    <option selected disabled>Seleccionar un rol</option>
                    <option value="admin">Administrador</option>
                    <option value="editor">Editor</option>
                    <option value="viewer">Visualizador</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Agregar usuario</button>
        </form>

        <!-- Tabla para cargar los datos -->
        <h2>Lista de usuarios</h2>
        <table class="table table-striped table-bordered" id="userTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Rol</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <!-- Los usuarios se agregarán aquí dinámicamente -->
            </tbody>
        </table>
    </div>

    <script>
        let toggleButton = document.getElementById("toggleDarkMode");
        let body = document.body;

        toggleButton.addEventListener('click', function() {
            body.classList.toggle('dark-mode');
            toggleButton.textContent = body.classList.contains('dark-mode') ? 'Modo Claro' : 'Modo Oscuro';
        });

        const userForm = document.getElementById('userForm');
        const userTable = document.getElementById('userTable').getElementsByTagName('tbody')[0];
        let userId = 1;
        let editingUserId = null; // Para saber si estamos editando un usuario

        userForm.addEventListener('submit', function(event) {
            event.preventDefault(); // Evitar el envío del formulario

            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            const rol = document.getElementById('rol').value;

            if (editingUserId) {
                // Editar usuario existente
                const row = userTable.rows[editingUserId - 1];
                row.cells[1].textContent = nombre;
                row.cells[2].textContent = email;
                row.cells[3].textContent = rol;
                editingUserId = null; // Resetear el ID de edición
            } else {
                // Agregar nuevo usuario
                const newRow = userTable.insertRow();
                newRow.insertCell(0).textContent = userId++;
                newRow.insertCell(1).textContent = nombre;
                newRow.insertCell(2).textContent = email;
                newRow.insertCell(3).textContent = rol;

                // Crear botones de editar y eliminar
                const actionsCell = newRow.insertCell(4);
                const editButton = document.createElement('button');
                editButton.textContent = 'Editar';
                editButton.className = 'btn btn-warning';
                editButton.onclick = function() {
                    document.getElementById('nombre').value = nombre;
                    document.getElementById('email').value = email;
                    document.getElementById('rol').value = rol;
                    editingUserId = newRow.rowIndex; // Guardar el índice de la fila para editar
                };
                actionsCell.appendChild(editButton);

                const deleteButton = document.createElement('button');
                deleteButton.textContent = 'Eliminar';
                deleteButton.className = 'btn btn-danger';
                deleteButton.onclick = function() {
                    userTable.deleteRow(newRow.rowIndex - 1); // Eliminar la fila
                };
                actionsCell.appendChild(deleteButton);
            }

            // Limpiar el formulario
            userForm.reset();
        });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
