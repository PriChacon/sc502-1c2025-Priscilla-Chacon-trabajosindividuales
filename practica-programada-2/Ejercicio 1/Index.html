<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Deducciones</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Calculadora de Deducciones</h1>
</header>

<section>
    <label for="salarioBruto">Ingrese por favor el salario bruto:</label>
    <input type="number" id="salarioBruto" placeholder="Salario Bruto:" required>
    <button id="calcularBtn">Calcular</button>
</section>

<section id="resultados">
    <h2>Resultados</h2>
    <p id="cargasSociales">Cargas Sociales: ₡0.00</p>
    <p id="impuestoRenta">Impuesto sobre la Renta: ₡0.00</p>
    <p id="salarioNeto">Salario Neto: ₡0.00</p>
</section>

<script src="script.js"></script>
</body>
</html>
